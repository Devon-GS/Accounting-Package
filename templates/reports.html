{% extends "base.html" %}
{% set title = "Reports" %}
{% set show_nav = false %}
{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark app-nav mb-4">
  <div class="container">
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('index') }}">Home</a>
      <a class="nav-link active" href="{{ url_for('reports') }}">Reports</a>
      <a class="nav-link" href="{{ url_for('reports_settings') }}">Settings</a>
    </div>
  </div>
</nav>

<div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
  <div>
    <h1 class="h2 fw-bold mb-1">Reports</h1>
  </div>
</div>

<div class="card shadow-sm border-0 panel-card mb-4">
  <div class="card-body p-4">
    <form method="get" class="row g-3 align-items-end">
      <div class="col-sm-4 col-md-3">
        <label class="form-label" for="month">Month</label>
        <input class="form-control" type="month" id="month" name="month" value="{{ month_value or '' }}">
      </div>
      <div class="col-sm-4 col-md-6">
        <button class="btn btn-primary" type="submit">Show Data</button>
      </div>
    </form>
  </div>
</div>

<div class="card shadow-sm border-0 panel-card">
  <div class="card-body p-4">
    <div class="table-responsive">
      <table class="table table-sm align-middle">
        <thead>
          <tr>
            <th>Description</th>
            <th class="text-end">Amount</th>
          </tr>
        </thead>
        <tbody>
          {% for row in report_rows %}
            <tr>
              <td>{{ row.label }}</td>
              <td class="text-end">R{{ "%.2f"|format(row.amount or 0) }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
