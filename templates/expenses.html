{% extends "base.html" %}
{% set title = "Expenses" %}
{% block content %}
<section class="card border-0 shadow-lg panel-card">
  <div class="card-body p-4 p-md-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
      <div>
        <!-- <p class="eyebrow mb-2">Expenses</p> -->
        <h1 class="h2 fw-bold mb-1">Current section setup</h1>
        <p class="text-body-secondary mb-0">Jump into the existing accounting workflow from here.</p>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-md-6 col-xl-4">
        <a class="btn btn-outline-primary btn-lg w-100 section-link-btn" href="{{ url_for('index') }}">Home</a>
      </div>
      <div class="col-md-6 col-xl-4">
        <a class="btn btn-outline-primary btn-lg w-100 section-link-btn" href="{{ url_for('cash_payments') }}">Cash Payments</a>
      </div>
      <div class="col-md-6 col-xl-4">
        <a class="btn btn-outline-primary btn-lg w-100 section-link-btn" href="{{ url_for('eft_payments') }}">EFT Payments</a>
      </div>
      <div class="col-md-6 col-xl-4">
        <a class="btn btn-outline-primary btn-lg w-100 section-link-btn" href="{{ url_for('accounts') }}">Accounts</a>
      </div>
      <div class="col-md-6 col-xl-4">
        <a class="btn btn-outline-primary btn-lg w-100 section-link-btn" href="{{ url_for('settings') }}">Settings</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
